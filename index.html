<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Request para Sistema de Información de Laboratorio (LIS)</title>
</head>
<body>
    <h1>Service Request para Sistema de Información de Laboratorio (LIS)R</h1>
    <form id="patientForm">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="familyName">Apellido:</label>
        <input type="text" id="familyName" name="familyName" required><br><br>

        <label for="birthDate">Fecha de Nacimiento:</label>
        <input type="date" id="birthDate" name="birthDate" required><br><br>

        <label for="identifierSystem">Tipo de documento de identidad:</label>
        <select id="identifierSystem" name="identifierSystem" required>
            <option value="http://cedula">Cédula de ciudadanía</option>
            <option value="http://pasaporte">Pasaporte</option>
        </select><br><br>

        <label for="identifierValue">Número de documento:</label>
        <input type="text" id="identifierValue" name="identifierValue" required><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="text" id="email" name="email" required><br><br>

        <label for="laboratoryAnalysis">Tipo de muestra:</label>
        <select id="laboratoryAnalisis" name="laboratoryAnalisis" required>
            <option value="122555007">Sangre Venosa</option>
            <option value="119297000">Sangre Capilar</option>
            <option value="122575003">Orina Espontanea</option>    
            <option value="122556008">Materia Fecal</option>    
            <option value="258580003">Biobpsia de Tejido</option>
            <option value="258606009">Saliva</option>    
            
        <label for="collectionDate">Fecha para la toma de muestra:</label>
        <input type="date" id="collectiondate" name="collectionDate" required><br><br>

        <label for="collectiontime">Hora de la cita:</label>
        <input type="time" id="collectiontime" name="collectiontime" min="08:00" max="18:00" required><br><br>

        <button type="submit">Enviar</button>
    </form>

    <script src="app.js"></script>
</body>
</html>
